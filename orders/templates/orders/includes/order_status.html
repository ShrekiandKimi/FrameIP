{% if order.status == "отменён" %}
    <span class="badge bg-secondary order-status order-status-cancelled">
        {{ order.status|capfirst }}
    </span>
{% elif order.status == "ожидает курьера" %}
    <span class="badge bg-warning text-dark order-status order-status-waiting">
        {{ order.status|capfirst }}
    </span>
{% else %}
    <span class="badge bg-success order-status order-status-active">
        {{ order.status|capfirst }}
    </span>
{% endif %}
